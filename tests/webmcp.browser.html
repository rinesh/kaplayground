<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>WebMCP browser integration test</title>
    </head>
    <body>
        <div id="root"></div>
        <pre id="webmcp-browser-result" data-status="running"></pre>
        <script type="module">
        const resultNode = document.querySelector("#webmcp-browser-result");
        const tools = new Map();
        const registeredNames = [];

        const modelContext = {
            async registerTool(tool, options = {}) {
                if (tools.has(tool.name)) {
                    throw new Error(`Duplicate WebMCP tool: ${tool.name}`);
                }
                tools.set(tool.name, tool);
                registeredNames.push(tool.name);
                options.signal?.addEventListener(
                    "abort",
                    () => tools.delete(tool.name),
                    { once: true },
                );
            },
        };

        Object.defineProperty(document, "modelContext", {
            configurable: true,
            value: modelContext,
        });
        globalThis.__webmcpBrowserTools = tools;
        history.replaceState(
            history.state,
            "",
            "/?stopped&webmcp-browser-test=1",
        );

        const delay = milliseconds =>
            new Promise(resolve => setTimeout(resolve, milliseconds));

        async function waitFor(predicate, label, timeoutMs = 30_000) {
            const deadline = performance.now() + timeoutMs;
            while (performance.now() < deadline) {
                const value = predicate();
                if (value) return value;
                await delay(50);
            }
            throw new Error(`Timed out waiting for ${label}.`);
        }

        async function withTimeout(promise, label, timeoutMs = 60_000) {
            let timer;
            try {
                return await Promise.race([
                    promise,
                    new Promise((_, reject) => {
                        timer = setTimeout(
                            () => reject(new Error(`Timed out during ${label}.`)),
                            timeoutMs,
                        );
                    }),
                ]);
            } finally {
                clearTimeout(timer);
            }
        }

        function assert(condition, message) {
            if (!condition) throw new Error(message);
        }

        async function invoke(name, input) {
            const tool = tools.get(name);
            assert(tool, `WebMCP tool was not registered: ${name}`);
            const controller = new AbortController();
            return await withTimeout(
                tool.execute(input, { signal: controller.signal }),
                name,
            );
        }

        async function findMainFile(firstInspection) {
            let inspection = firstInspection;
            while (true) {
                const file = inspection.files.find(({ path }) => path === "main.js");
                if (file) return file;
                if (inspection.nextFileOffset === null) {
                    throw new Error("main.js was not listed by inspect_game.");
                }
                inspection = await invoke("kaplayground_inspect_game", {
                    fileOffset: inspection.nextFileOffset,
                    fileLimit: 100,
                });
                assert(
                    inspection.revision === firstInspection.revision,
                    "The project changed while paging file metadata.",
                );
            }
        }

        function finish(result) {
            const json = JSON.stringify(result);
            globalThis.__webmcpBrowserTestResult = result;
            document.documentElement.dataset.webmcpResult = btoa(
                unescape(encodeURIComponent(json)),
            );
            resultNode.dataset.status = result.passed ? "passed" : "failed";
            resultNode.textContent = JSON.stringify(result, null, 2);
        }

        try {
            await import("/src/main.tsx");
            await waitFor(() => tools.size === 8, "all eight WebMCP tools", 60_000);
            await waitFor(
                () => document.querySelector("#game-view")?.contentWindow,
                "the game preview iframe",
                60_000,
            );

            const inspected = await invoke("kaplayground_inspect_game", {
                fileLimit: 100,
            });
            assert(typeof inspected.revision === "string", "inspect_game omitted a revision.");
            await findMainFile(inspected);

            const read = await invoke("kaplayground_read_files", {
                expectedRevision: inspected.revision,
                paths: ["main.js"],
            });
            assert(read.files.length === 1, "read_files did not return main.js.");
            assert(
                typeof read.files[0].content === "string",
                "read_files did not return source content.",
            );

            const marker = `\n// WebMCP browser test ${Date.now()}\n`;
            const updated = await invoke("kaplayground_update_game", {
                expectedRevision: inspected.revision,
                changes: [{
                    action: "replace",
                    path: "main.js",
                    content: read.files[0].content + marker,
                }],
                focusPath: "main.js",
            });
            assert(updated.committed === true, "update_game was not committed.");
            assert(
                updated.revision !== inspected.revision,
                "update_game did not advance the revision.",
            );

            const run = await invoke("kaplayground_run_game", {
                expectedRevision: updated.revision,
                mode: "restart-and-check",
                consoleLimit: 20,
                objectLimit: 10,
            });
            assert(run.status !== "failed", `run_game failed: ${run.summary}`);
            assert(typeof run.runId === "string", "run_game did not return a run id.");

            const checked = await invoke("kaplayground_run_game", {
                expectedRevision: updated.revision,
                mode: "check-current",
                consoleLimit: 20,
                objectLimit: 10,
            });
            assert(
                checked.status !== "failed",
                `check-current failed: ${checked.summary}`,
            );
            assert(
                checked.runId === run.runId,
                "check-current inspected a different run.",
            );

            const beforeOpen = await invoke("kaplayground_inspect_game", {});
            assert(
                beforeOpen.hasUnsavedChanges === true,
                "The update should leave the transient game with unsaved changes.",
            );

            const found = await invoke("kaplayground_find_examples", {
                limit: 10,
                offset: 0,
            });
            const example = found.examples.find(({ key }) => typeof key === "string");
            assert(example, "find_examples returned no usable example.");

            const declining = invoke("kaplayground_open_example", {
                expectedRevision: updated.revision,
                key: example.key,
                discardUnsavedChanges: true,
            });
            const declineDialog = await waitFor(
                () => document.querySelector("#confirm-dialog[open]"),
                "the discard confirmation dialog",
            );
            const declineButton = [...declineDialog.querySelectorAll("button")]
                .find(button => button.textContent?.trim() === "Keep my game");
            assert(declineButton, "The keep-game button was not rendered.");
            declineButton.click();
            const declined = await declining;
            assert(declined.committed === false, "Declining still committed a replacement.");
            assert(
                declined.revision === updated.revision,
                "Declining changed the project revision.",
            );
            await waitFor(
                () => !document.querySelector("#confirm-dialog[open]"),
                "the declined confirmation dialog to close",
            );

            const opening = invoke("kaplayground_open_example", {
                expectedRevision: updated.revision,
                key: example.key,
                discardUnsavedChanges: true,
            });
            const confirmDialog = await waitFor(
                () => document.querySelector("#confirm-dialog[open]"),
                "the discard confirmation dialog to reopen",
            );
            const confirmButton = [...confirmDialog.querySelectorAll("button")]
                .find(button => button.textContent?.trim() === "Discard and open");
            assert(confirmButton, "The discard confirmation button was not rendered.");
            confirmButton.click();

            const opened = await opening;
            assert(opened.committed === true, "open_example was not committed.");
            assert(opened.opened === example.key, "open_example opened the wrong example.");
            assert(
                opened.revision !== updated.revision,
                "open_example did not advance the revision.",
            );

            const afterOpen = await invoke("kaplayground_inspect_game", {});
            assert(
                afterOpen.revision === opened.revision,
                "inspect_game did not observe the opened example revision.",
            );

            finish({
                passed: true,
                registeredNames,
                initialRevision: inspected.revision,
                updatedRevision: updated.revision,
                updateCommitted: updated.committed,
                runStatus: run.status,
                runId: run.runId,
                currentCheckStatus: checked.status,
                currentRunId: checked.runId,
                declineCommitted: declined.committed,
                declineRevision: declined.revision,
                confirmationShown: true,
                openCommitted: opened.committed,
                openedKey: opened.opened,
                finalRevision: afterOpen.revision,
            });
        } catch (error) {
            finish({
                passed: false,
                registeredNames,
                error: error instanceof Error ? error.message : String(error),
                stack: error instanceof Error ? error.stack : null,
            });
        }
        </script>
    </body>
</html>
