<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>WebMCP browser integration test</title>
    </head>
    <body>
        <div id="root"></div>
        <pre id="webmcp-browser-result" data-status="running"></pre>
        <script type="module">
        const resultNode = document.querySelector("#webmcp-browser-result");
        const tools = new Map();
        const registeredNames = [];

        const modelContext = {
            async registerTool(tool, options = {}) {
                if (tools.has(tool.name)) {
                    throw new Error(`Duplicate WebMCP tool: ${tool.name}`);
                }
                tools.set(tool.name, tool);
                registeredNames.push(tool.name);
                options.signal?.addEventListener(
                    "abort",
                    () => tools.delete(tool.name),
                    { once: true },
                );
            },
        };

        Object.defineProperty(document, "modelContext", {
            configurable: true,
            value: modelContext,
        });
        globalThis.__webmcpBrowserTools = tools;
        history.replaceState(
            history.state,
            "",
            "/?stopped&webmcp-browser-test=1",
        );

        const delay = milliseconds =>
            new Promise(resolve => setTimeout(resolve, milliseconds));

        async function waitFor(predicate, label, timeoutMs = 30_000) {
            const deadline = performance.now() + timeoutMs;
            while (performance.now() < deadline) {
                const value = predicate();
                if (value) return value;
                await delay(50);
            }
            throw new Error(`Timed out waiting for ${label}.`);
        }

        async function withTimeout(promise, label, timeoutMs = 60_000) {
            let timer;
            try {
                return await Promise.race([
                    promise,
                    new Promise((_, reject) => {
                        timer = setTimeout(
                            () => reject(new Error(`Timed out during ${label}.`)),
                            timeoutMs,
                        );
                    }),
                ]);
            } finally {
                clearTimeout(timer);
            }
        }

        function assert(condition, message) {
            if (!condition) throw new Error(message);
        }

        async function invoke(name, input) {
            const tool = tools.get(name);
            assert(tool, `WebMCP tool was not registered: ${name}`);
            const controller = new AbortController();
            return await withTimeout(
                tool.execute(input, { signal: controller.signal }),
                name,
            );
        }

        function fileAction(inspection, path) {
            return inspection.files.some(file => file.path === path)
                ? "replace"
                : "create";
        }

        function sceneObject(result, tag) {
            return result.scene?.objects?.find(object => object.tags?.includes(tag));
        }

        function consoleContains(result, text) {
            return result.console?.entries?.some(entry =>
                JSON.stringify(entry.values).includes(text)
            );
        }

        function finish(result) {
            const json = JSON.stringify(result);
            globalThis.__webmcpBrowserTestResult = result;
            document.documentElement.dataset.webmcpResult = btoa(
                unescape(encodeURIComponent(json)),
            );
            resultNode.dataset.status = result.passed ? "passed" : "failed";
            resultNode.textContent = JSON.stringify(result, null, 2);
        }

        try {
            await import("/src/main.tsx");
            await waitFor(() => tools.size === 8, "all eight WebMCP tools", 60_000);
            await waitFor(
                () => document.querySelector("#game-view")?.contentWindow,
                "the game preview iframe",
                60_000,
            );

            const { useProject } = await import(
                "/src/features/Projects/stores/useProject.ts"
            );
            const assetPath = "sprites/webmcp-fixture.svg";
            const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="40" height="20"><rect width="40" height="20" fill="#fff"/></svg>';
            const assets = new Map(useProject.getState().project.assets);
            assets.set(assetPath, {
                name: "webmcp-fixture.svg",
                kind: "sprite",
                path: assetPath,
                url: `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`,
                importFunction:
                    'loadSprite("webmcp-fixture", "assets/sprites/webmcp-fixture.svg", { sliceX: 2, sliceY: 1 });',
            });
            useProject.getState().setProject({ assets });

            const inspected = await invoke("kaplayground_inspect_game", {
                fileLimit: 100,
            });
            assert(typeof inspected.revision === "string", "inspect_game omitted a revision.");
            assert("activeRunId" in inspected, "inspect_game omitted the active run id.");
            assert("readiness" in inspected, "inspect_game omitted readiness.");

            const read = await invoke("kaplayground_read_files", {
                expectedRevision: inspected.revision,
                paths: ["main.js"],
            });
            assert(read.files.length === 1, "read_files did not return main.js.");

            const healthyMain = `
import { startFixture } from "./scenes/game.js";

startFixture();
`;
            const healthyScene = `
import { PLAYER_SPEED } from "./movement.js";

export function startFixture() {
    kaplay({
        width: 320,
        height: 240,
        background: [24, 28, 36],
    });

    const player = add([
        rect(24, 32),
        pos(40, 120),
        area(),
        anchor("center"),
        color(96, 165, 250),
        "webmcp-player",
    ]);

    onKeyDown("right", () => player.move(PLAYER_SPEED, 0));
}
`;
            const movementSource = "export const PLAYER_SPEED = 180;\n";
            const updated = await invoke("kaplayground_update_game", {
                expectedRevision: inspected.revision,
                changes: [
                    {
                        action: "replace",
                        path: "main.js",
                        content: healthyMain,
                    },
                    {
                        action: fileAction(inspected, "scenes/game.js"),
                        path: "scenes/game.js",
                        content: healthyScene,
                    },
                    {
                        action: fileAction(inspected, "scenes/movement.js"),
                        path: "scenes/movement.js",
                        content: movementSource,
                    },
                ],
                focusPath: "main.js",
            });
            assert(updated.committed === true, "update_game was not committed.");

            const dimensions = await invoke("kaplayground_find_assets", {
                query: "webmcp-fixture",
                kind: "sprite",
                source: "game",
                limit: 10,
            });
            const dimensionAsset = dimensions.assets.find(asset =>
                asset.path === assetPath
            );
            assert(dimensionAsset, "find_assets omitted the fixture sprite.");
            assert(
                dimensionAsset.imageDimensions?.width === 40
                    && dimensionAsset.imageDimensions?.height === 20,
                "find_assets returned incorrect image dimensions.",
            );
            assert(
                dimensionAsset.spriteFrameDimensions?.width === 20
                    && dimensionAsset.spriteFrameDimensions?.height === 20,
                "find_assets returned incorrect sprite-frame dimensions.",
            );

            const run = await invoke("kaplayground_run_game", {
                expectedRevision: updated.revision,
                mode: "restart-and-check",
                inspectTag: "webmcp-player",
                focus: true,
                consoleLimit: 20,
                objectLimit: 10,
            });
            assert(run.status === "passed", `Healthy run was ${run.status}: ${run.summary}`);
            assert(typeof run.runId === "string", "run_game did not return a run id.");
            assert(run.readiness?.status === "ready", "Healthy run was not ready.");
            assert(run.readiness?.assetsLoaded === true, "Asset readiness was not confirmed.");
            assert(run.readiness?.firstFrame === true, "First-frame readiness was not confirmed.");
            assert(run.focus?.canvasFocused === true, "Canvas focus was not confirmed.");
            assert(run.diagnostics?.sourceCurrent === true, "Diagnostics were not current.");
            assert(run.scene?.objectsAvailable === true, "Healthy scene objects were unavailable.");

            const initialPlayer = sceneObject(run, "webmcp-player");
            assert(initialPlayer, "The fixture player was not inspected.");
            assert(initialPlayer.anchor === "center", "The player anchor was not reported.");
            assert(
                initialPlayer.renderedBounds?.height > 31
                    && initialPlayer.renderedBounds?.height < 33,
                "Rendered bounds were not reported.",
            );
            assert(
                initialPlayer.collisionBounds?.world?.height > 31
                    && initialPlayer.collisionBounds?.world?.height < 33,
                "Collision bounds were not reported.",
            );

            let movementResolve;
            const movementInput = new Promise(resolve => {
                movementResolve = resolve;
            });
            globalThis.__webmcpMovementInputComplete = () => movementResolve();
            document.documentElement.dataset.webmcpPhase = "movement-ready";
            await withTimeout(movementInput, "browser movement input", 30_000);
            await delay(120);

            const checked = await invoke("kaplayground_run_game", {
                expectedRevision: updated.revision,
                mode: "check-current",
                inspectTag: "webmcp-player",
                consoleLimit: 20,
                objectLimit: 10,
            });
            assert(
                checked.status === "passed",
                `Healthy check-current was ${checked.status}: ${checked.summary}`,
            );
            assert(checked.runId === run.runId, "check-current inspected a different run.");
            const movedPlayer = sceneObject(checked, "webmcp-player");
            assert(
                movedPlayer?.position?.x > initialPlayer.position.x + 5,
                "Supported browser input did not move the focused player.",
            );

            const savedName = `WebMCP fixture ${Date.now()}`;
            const saved = await invoke("kaplayground_save_game", {
                expectedRevision: updated.revision,
                name: savedName,
            });
            assert(saved.name === savedName, "save_game did not persist the requested name.");
            assert(typeof saved.projectId === "string", "save_game omitted the project id.");
            assert(saved.revision !== updated.revision, "Renaming did not advance the revision.");

            const persisted = await useProject.getState().getProject(saved.projectId);
            assert(persisted?.name === savedName, "The saved project name was not stored.");
            assert(
                persisted?.files.get("main.js")?.value === healthyMain,
                "The saved fixture source was not stored.",
            );
            await useProject.getState().createNewProject(
                persisted.mode,
                persisted,
                undefined,
                false,
            );
            useProject.getState().setProjectKey(saved.projectId);
            const reopened = await invoke("kaplayground_inspect_game", {
                fileLimit: 100,
            });
            assert(reopened.name === savedName, "The saved project did not reopen by name.");
            assert(reopened.projectId === saved.projectId, "The saved project id did not reopen.");
            const reopenedSource = await invoke("kaplayground_read_files", {
                expectedRevision: reopened.revision,
                paths: ["main.js"],
            });
            assert(
                reopenedSource.files[0].content === healthyMain,
                "The reopened project source changed.",
            );
            // Keep subsequent failure fixtures transient so example opening still
            // requires the existing in-page discard confirmation.
            useProject.getState().setProjectKey(null);

            const pendingSource = `
function startPendingAssets() {
    kaplay({ width: 320, height: 240 });
    loadSprite(
        "webmcp-pending",
        "https://webmcp-pending-asset.invalid/never.png",
    );
    add([rect(16, 16), pos(20, 20), "pending-object"]);
}
startPendingAssets();
`;
            const pendingUpdate = await invoke("kaplayground_update_game", {
                expectedRevision: reopened.revision,
                changes: [{
                    action: "replace",
                    path: "main.js",
                    content: pendingSource,
                }],
                focusPath: "main.js",
            });
            const pendingRun = await invoke("kaplayground_run_game", {
                expectedRevision: pendingUpdate.revision,
                mode: "restart-and-check",
                inspectTag: "pending-object",
                objectLimit: 10,
            });
            assert(
                pendingRun.status === "incomplete",
                `Pending assets should be incomplete, got ${pendingRun.status}.`,
            );
            assert(
                pendingRun.readiness?.status === "timed-out",
                "Pending assets did not report a loading timeout.",
            );

            const inspectionErrorSource = `
function startInspectionError() {
    const k = kaplay({ global: false, width: 320, height: 240 });
    k.add([
        k.pos(20, 20),
        "inspection-error",
        {
            id: "inspectionProbe",
            renderArea() {
                console.error("webmcp inspection-time error");
                return { pos: { x: -6, y: -6 }, width: 12, height: 12 };
            },
        },
    ]);
}
startInspectionError();
`;
            const inspectionErrorUpdate = await invoke(
                "kaplayground_update_game",
                {
                    expectedRevision: pendingUpdate.revision,
                    changes: [{
                        action: "replace",
                        path: "main.js",
                        content: inspectionErrorSource,
                    }],
                    focusPath: "main.js",
                },
            );
            const inspectionErrorRun = await invoke("kaplayground_run_game", {
                expectedRevision: inspectionErrorUpdate.revision,
                mode: "restart-and-check",
                inspectTag: "inspection-error",
                objectLimit: 10,
            });
            assert(
                inspectionErrorRun.status === "failed",
                `Inspection-time console errors should fail, got ${inspectionErrorRun.status}.`,
            );
            assert(
                consoleContains(inspectionErrorRun, "webmcp inspection-time error"),
                "The inspection-time console error was sampled too early.",
            );

            const unavailableSource = `
function startUnavailableInspection() {
    const k = kaplay({ global: false, width: 320, height: 240 });
    k.add([
        k.rect(16, 16),
        k.pos(20, 20),
        "unavailable-object",
    ]);
    globalThis._k_ctx = { debug: k.debug };
    globalThis._k_debug = k.debug;
}
startUnavailableInspection();
`;
            const unavailableUpdate = await invoke("kaplayground_update_game", {
                expectedRevision: inspectionErrorUpdate.revision,
                changes: [{
                    action: "replace",
                    path: "main.js",
                    content: unavailableSource,
                }],
                focusPath: "main.js",
            });
            const unavailableRun = await invoke("kaplayground_run_game", {
                expectedRevision: unavailableUpdate.revision,
                mode: "restart-and-check",
                inspectTag: "unavailable-object",
                objectLimit: 10,
            });
            assert(
                unavailableRun.status === "incomplete",
                `Unavailable object inspection should be incomplete, got ${unavailableRun.status}.`,
            );
            assert(
                unavailableRun.scene?.objectsAvailable === false,
                "Unavailable object inspection was not identified.",
            );

            const beforeOpen = await invoke("kaplayground_inspect_game", {});
            assert(beforeOpen.activeRunId === unavailableRun.runId, "inspect_game omitted the active run.");
            assert(beforeOpen.readiness?.status === "ready", "inspect_game omitted active readiness.");
            assert(
                beforeOpen.hasUnsavedChanges === true,
                "The regression updates should leave unsaved changes.",
            );

            const found = await invoke("kaplayground_find_examples", {
                limit: 10,
                offset: 0,
            });
            const example = found.examples.find(({ key }) => typeof key === "string");
            assert(example, "find_examples returned no usable example.");

            const declining = invoke("kaplayground_open_example", {
                expectedRevision: unavailableUpdate.revision,
                key: example.key,
                discardUnsavedChanges: true,
            });
            const declineDialog = await waitFor(
                () => document.querySelector("#confirm-dialog[open]"),
                "the discard confirmation dialog",
            );
            const declineButton = [...declineDialog.querySelectorAll("button")]
                .find(button => button.textContent?.trim() === "Keep my game");
            assert(declineButton, "The keep-game button was not rendered.");
            declineButton.click();
            const declined = await declining;
            assert(declined.committed === false, "Declining still committed a replacement.");
            assert(
                declined.revision === unavailableUpdate.revision,
                "Declining changed the project revision.",
            );
            await waitFor(
                () => !document.querySelector("#confirm-dialog[open]"),
                "the declined confirmation dialog to close",
            );

            const opening = invoke("kaplayground_open_example", {
                expectedRevision: unavailableUpdate.revision,
                key: example.key,
                discardUnsavedChanges: true,
            });
            const openDialog = await waitFor(
                () => document.querySelector("#confirm-dialog[open]"),
                "the second discard confirmation dialog",
            );
            const confirmButton = [...openDialog.querySelectorAll("button")]
                .find(button => button.textContent?.trim() === "Discard and open");
            assert(confirmButton, "The discard confirmation button was not rendered.");
            confirmButton.click();
            const opened = await opening;
            assert(opened.committed === true, "Confirmed example opening did not commit.");
            assert(opened.opened === example.key, "open_example returned the wrong key.");
            assert(
                opened.revision !== unavailableUpdate.revision,
                "Opening an example did not replace the revision.",
            );

            finish({
                passed: true,
                registered: registeredNames,
                runStatus: run.status,
                currentCheckStatus: checked.status,
                readinessStatus: run.readiness.status,
                focusConfirmed: run.focus.canvasFocused,
                movementConfirmed: movedPlayer.position.x > initialPlayer.position.x,
                dimensionsConfirmed: true,
                saveReopenConfirmed: reopened.projectId === saved.projectId,
                pendingAssetsStatus: pendingRun.status,
                inspectionErrorStatus: inspectionErrorRun.status,
                unavailableInspectionStatus: unavailableRun.status,
                declinedCommitted: declined.committed,
                opened: opened.opened,
            });
        } catch (error) {
            finish({
                passed: false,
                error: error instanceof Error
                    ? `${error.name}: ${error.message}\n${error.stack ?? ""}`
                    : String(error),
                registered: registeredNames,
            });
        }
        </script>
    </body>
</html>
