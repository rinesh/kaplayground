<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>WebMCP browser integration test</title>
    </head>
    <body>
        <div id="root"></div>
        <pre id="webmcp-browser-result" data-status="running"></pre>
        <script type="module">
        const resultNode = document.querySelector("#webmcp-browser-result");
        const auditCatalog = new URLSearchParams(location.search).has("catalog-audit");
        const tools = new Map();
        const registeredNames = [];

        const modelContext = {
            async registerTool(tool, options = {}) {
                if (tools.has(tool.name)) {
                    throw new Error(`Duplicate WebMCP tool: ${tool.name}`);
                }
                tools.set(tool.name, tool);
                registeredNames.push(tool.name);
                options.signal?.addEventListener(
                    "abort",
                    () => tools.delete(tool.name),
                    { once: true },
                );
            },
        };

        Object.defineProperty(document, "modelContext", {
            configurable: true,
            value: modelContext,
        });
        globalThis.__webmcpBrowserTools = tools;
        history.replaceState(
            history.state,
            "",
            "/?stopped&webmcp-browser-test=1",
        );

        const delay = milliseconds =>
            new Promise(resolve => setTimeout(resolve, milliseconds));

        async function waitFor(predicate, label, timeoutMs = 30_000) {
            const deadline = performance.now() + timeoutMs;
            while (performance.now() < deadline) {
                const value = predicate();
                if (value) return value;
                await delay(50);
            }
            throw new Error(`Timed out waiting for ${label}.`);
        }

        async function withTimeout(promise, label, timeoutMs = 60_000) {
            let timer;
            try {
                return await Promise.race([
                    promise,
                    new Promise((_, reject) => {
                        timer = setTimeout(
                            () => reject(new Error(`Timed out during ${label}.`)),
                            timeoutMs,
                        );
                    }),
                ]);
            } finally {
                clearTimeout(timer);
            }
        }

        function assert(condition, message) {
            if (!condition) throw new Error(message);
        }

        async function invoke(name, input) {
            const tool = tools.get(name);
            assert(tool, `WebMCP tool was not registered: ${name}`);
            const controller = new AbortController();
            return await withTimeout(
                tool.execute(input, { signal: controller.signal }),
                name,
            );
        }

        function fileAction(inspection, path) {
            return inspection.files.some(file => file.path === path)
                ? "replace"
                : "create";
        }

        function sceneObject(result, tag) {
            return result.scene?.objects?.find(object => object.tags?.includes(tag));
        }

        function consoleContains(result, text) {
            return result.console?.entries?.some(entry =>
                JSON.stringify(entry.values).includes(text)
            );
        }

        function finish(result) {
            const json = JSON.stringify(result);
            globalThis.__webmcpBrowserTestResult = result;
            document.documentElement.dataset.webmcpResult = btoa(
                unescape(encodeURIComponent(json)),
            );
            resultNode.dataset.status = result.passed ? "passed" : "failed";
            resultNode.textContent = JSON.stringify(result, null, 2);
        }

        try {
            await import("/src/main.tsx");
            await waitFor(() => tools.size === 8, "all eight WebMCP tools", 60_000);
            await waitFor(
                () => document.querySelector("#game-view")?.contentWindow,
                "the game preview iframe",
                60_000,
            );

            const { useProject } = await import(
                "/src/features/Projects/stores/useProject.ts"
            );
            const { useEditor } = await import("/src/hooks/useEditor.ts");
            const { useWorkspace } = await import("/src/hooks/useWorkspace.ts");
            const { useGameConsole, gameConsoleCapture } = await import("/src/hooks/useGameConsole.ts");
            const { useWebMCPActivity } = await import("/src/integrations/webmcp/webMCPActivity.ts");
            const { db } = await import("/src/db/client/db.tsx");
            const { loadProject } = await import("/src/features/Projects/application/loadProject.tsx");
            const { confirmNavigate } = await import("/src/util/confirmNavigate.tsx");
            await waitFor(() => useEditor.getState().previewReadiness, "initial preview startup");
            const initial = await invoke("kaplayground_inspect_game", {});
            const initialIframe = document.querySelector("#game-view");
            // The preview is intentionally allowed to start before Monaco.
            const initialEditor = await waitFor(() => useEditor.getState().runtime.editor, "the hidden code editor");
            assert(initial.editorVisible === false, "Assets must be selected on fresh visits.");
            assert(initial.selectedAsset === null, "A fresh draft must not select an asset.");
            assert(initial.saveStatus === "draft" && initial.projectId === null, "Initialization must not save a draft.");
            assert((await db.getAllKeys("projects")).length === 0, "Startup created a saved project.");

            const toolbar = document.querySelector('[role="toolbar"][aria-label="Game workspace"]');
            assert(toolbar?.querySelectorAll("select").length === 1, "The toolbar must keep the game chooser without an engine selector.");
            const saveButton = toolbar.querySelector("#project-save-button");
            const assertQuietSaveStatus = () => {
                assert(!toolbar.querySelector('[role="status"]'), "Routine save status should not occupy a toolbar line.");
                assert(!/Draft · edit to save|Saved locally/.test(toolbar.textContent), "The toolbar still shows a routine save label.");
                assert(!toolbar.querySelector("#project-save-error"), "A healthy project shows a save failure.");
                const tip = saveButton.getAttribute("data-tooltip-html");
                const status = useProject.getState().saveStatus;
                if (status === "draft") assert(/first edit.*automatically/.test(tip), "Drafts must explain when autosave starts.");
                if (status === "saved") assert(/Autosave on.*in this browser/.test(tip) && /autosave on/.test(saveButton.textContent), "Saved projects must expose local autosave in the tooltip and accessible name.");
                if (status === "saving") assert(/Autosaving.*in this browser/.test(tip), "Pending saves must explain that local autosave is running.");
            };
            assert(saveButton && !saveButton.disabled, "Untouched drafts must still have an explicit Save action.");
            assertQuietSaveStatus();
            const homeLink = toolbar.querySelector('a[aria-label="KAPLAYGROUND home"]');
            assert(homeLink?.getAttribute("href") === "/?example=webmcpAgent", "The logo must link back to the Codex starting point.");
            // Avoid native navigation while checking that modified clicks remain native.
            homeLink.removeAttribute("href");
            try {
                for (const modifiers of [{ ctrlKey: true }, { metaKey: true }, { shiftKey: true }, { altKey: true }, { button: 1 }]) {
                    const click = new MouseEvent("click", { bubbles: true, cancelable: true, ...modifiers });
                    homeLink.dispatchEvent(click);
                    assert(!click.defaultPrevented, "The home link intercepted a modified click.");
                }
            } finally {
                homeLink.setAttribute("href", "/?example=webmcpAgent");
            }
            const projectSettings = toolbar.querySelector('button[aria-label="Project settings"]');
            assert(projectSettings?.textContent.trim() === "Project", "The preferences shortcut must use one project label for every game.");
            const preferencesDialog = document.querySelector("#project-preferences");
            const closePreferences = async () => {
                [...preferencesDialog.querySelectorAll("button")].find(button => button.textContent.trim() === "Close").click();
                await waitFor(() => !preferencesDialog.open, "closing project preferences");
                // Dismissal resets the form after the closing transition.
                // Don't reopen it while that reset is still pending.
                await Promise.allSettled(preferencesDialog.getAnimations({ subtree: true }).map(animation => animation.finished));
                await new Promise(requestAnimationFrame);
            };
            projectSettings.click();
            await waitFor(() => preferencesDialog.open && preferencesDialog.querySelector('input[name="name"]').value === useProject.getState().project.name, "the current project's preferences shortcut");
            await closePreferences();
            for (const label of ["Browse all", "Run game", "Copy game link", "Project options", "Help and about", "Settings"]) {
                assert([...toolbar.querySelectorAll("button")].some(button => (button.getAttribute("aria-label") || button.textContent.trim()) === label), `Missing toolbar shortcut: ${label}`);
            }
            assert(document.querySelector('aside[aria-label="Codex tips"]'), "Codex tips must appear beneath the game.");
            const gameBrowser = document.querySelector("#examples-browser");
            const browseButton = [...toolbar.querySelectorAll("button")].find(button => button.textContent.trim() === "Browse all");
            browseButton.click();
            await waitFor(() => gameBrowser.open && gameBrowser.querySelector('[aria-label="Starting point collection"]'), "the starting point browser");
            const { demos } = await import("/src/data/demos.ts");
            const { isPlayableStartingPoint } = await import("/src/data/startingPoints.ts");
            const { parseAssetPath } = await import("/src/util/assetsParsing.ts");
            const { parseAssets } = await import("/src/util/compiler.ts");
            const appleData = parseAssetPath("/sprites/apple.png", undefined, new Map());
            assert(appleData.startsWith("data:image/png;base64,"), "Built-in art must remain embeddable.");
            for (const path of ["sprites/apple.png", "/sprites/apple.png", "./sprites/apple.png", "././sprites/apple.png"]) {
                assert(parseAssetPath(path, undefined, new Map()) === appleData, `Local asset prefix was not normalized: ${path}`);
                assert(parseAssets(`loadSprite("apple", "${path}");`, new Map()).includes(appleData), `The compiler did not embed ${path}.`);
            }
            const privatePath = "assets/sprites/private.png";
            const privateAssets = new Map([[privatePath, { path: privatePath, url: "data:image/png;base64,cHJpdmF0ZQ==" }]]);
            assert(parseAssetPath(`./${privatePath}`, undefined, privateAssets) === privateAssets.get(privatePath).url, "Relative project assets must use the project snapshot.");
            for (const path of ["https://example.com/sprites/apple.png", "//example.com/sprites/apple.png", "../sprites/apple.png", "/sprites/missing.png"]) {
                assert(parseAssetPath(path, undefined, new Map()) === path, `An unrelated asset URL was rewritten: ${path}`);
            }
            const computedLoader = 'loadSprite(name, `/sprites/${name}.png`);';
            assert(parseAssets(computedLoader, new Map()) === computedLoader, "Runtime-computed asset paths must not be rewritten as static strings.");
            const gamesSection = gameBrowser.querySelector("#starting-points-games").closest("section");
            assert(gamesSection.querySelector("article h3").textContent === "Play & Remix with Codex", "The Codex game must lead the starting points.");
            assert(gamesSection.querySelectorAll("article").length === demos.filter(isPlayableStartingPoint).length, "Playable games were removed or mixed with feature demos.");
            assert(gameBrowser.querySelectorAll("article").length === demos.length, "Every built-in sample must remain discoverable by default.");
            const collection = gameBrowser.querySelector('[aria-label="Starting point collection"]');
            assert(collection.value === "all", "The browser must retain games and feature samples by default.");
            collection.value = "features";
            collection.dispatchEvent(new Event("change", { bubbles: true }));
            await waitFor(() => !gameBrowser.querySelector("#starting-points-games"), "the feature-only collection");
            const starterSearch = gameBrowser.querySelector('[aria-label="Search starting points"]');
            Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value").set.call(starterSearch, "spriteAnim");
            starterSearch.dispatchEvent(new Event("input", { bubbles: true }));
            await waitFor(() => gameBrowser.querySelectorAll("article").length === 1, "canonical sample key search");
            assert(gameBrowser.querySelector("article h3").textContent === "Sprite Animations", "Feature samples need name/key search parity.");
            Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value").set.call(starterSearch, "");
            starterSearch.dispatchEvent(new Event("input", { bubbles: true }));
            collection.value = "all";
            collection.dispatchEvent(new Event("change", { bubbles: true }));
            gameBrowser.querySelector('[aria-label="Close game browser"]').click();
            await waitFor(() => !gameBrowser.open, "closing the game browser");
            await Promise.allSettled(gameBrowser.getAnimations({ subtree: true }).map(animation => animation.finished));
            await new Promise(requestAnimationFrame);

            const search = document.querySelector('[aria-label="Search assets"]');
            Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value").set.call(search, "bean");
            search.dispatchEvent(new Event("input", { bubbles: true }));
            await delay(50);
            const bean = document.querySelector('button[aria-label="Select bean"]');
            assert(bean && bean.textContent.includes("bean"), "Assets need permanent canonical names.");
            bean.click();
            assert(useWorkspace.getState().selectedAsset?.key === "bean", "Asset clicking did not select the canonical key.");
            const dragData = new DataTransfer();
            bean.dispatchEvent(new DragEvent("dragstart", { bubbles: true, dataTransfer: dragData }));
            assert(bean.draggable === false && bean.querySelector("img").draggable === false, "Asset dragging must be disabled.");
            assert(dragData.getData("text/plain") === "", "Asset dragging generated code.");
            const copied = [];
            const clipboardWrite = navigator.clipboard.writeText;
            navigator.clipboard.writeText = async text => { copied.push(text); };
            await delay(50);
            for (const label of ["Copy name", "Copy prompt"]) {
                [...document.querySelectorAll(".asset-browser button")].find(button => button.textContent.trim() === label).click();
            }
            navigator.clipboard.writeText = clipboardWrite;
            assert(copied[0] === "bean" && copied[1]?.includes("built-in bean"), "Copy actions did not use promptable identifiers.");
            const library = await invoke("kaplayground_find_assets", { query: "bean", kind: "sprite", source: "library", limit: 50 });
            assert(library.assets.some(asset => asset.key === useWorkspace.getState().selectedAsset?.key), "Visible asset identifiers differ from find_assets.");
            const assetView = label => [...document.querySelectorAll('[aria-label="Asset source"] button')].find(button => button.textContent.trim() === label);
            assert(assetView("Library") && assetView("In game") && !assetView("All"), "Assets should have Library and In game views without All.");
            Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value").set.call(search, "");
            search.dispatchEvent(new Event("input", { bubbles: true }));

            const soundPreviews = [];
            let previousAudio;
            const kinds = label => [...document.querySelectorAll('[aria-label="Asset kinds"] button')].find(button => button.textContent.trim() === label);
            kinds("Sounds").click();
            for (const key of ["bean_voice", "mark_voice", "burp", "kaboom2000"]) {
                const card = await waitFor(() => document.querySelector(`button[aria-label="Select ${key}"]`), `${key} sound card`);
                card.click();
                const audio = await waitFor(() => document.querySelector(`audio[aria-label="Preview ${key}"]`), `${key} sound player`);
                if (previousAudio) await waitFor(() => previousAudio.paused, "stopping the previous sound on selection");
                await waitFor(() => audio.readyState >= 1 && audio.duration > 0 && Number.isFinite(audio.duration), `${key} metadata before playback`, 10_000);
                assert(audio.getAttribute("src").startsWith("/crew/"), `${key} must use a served sound file with an audio MIME type.`);
                if (audio.duration < 1) assert(document.querySelector(".asset-browser").textContent.includes("Short clip"), "Subsecond clips need a duration that doesn't round down to 0:00.");
                document.documentElement.dataset.webmcpPhase = `sound-preview-${key}`;
                await new Promise(resolve => { globalThis.__webmcpSoundInputComplete = resolve; });
                await waitFor(() => audio.currentTime > 0, `playing ${key} from its visible controls`, 10_000);
                assert(!audio.error, `${key} failed to decode.`);
                soundPreviews.push({ key, duration: audio.duration, played: true });
                previousAudio = audio;
            }
            document.querySelector('button[aria-label="Clear asset selection"]').click();
            await waitFor(() => !document.querySelector(".asset-browser audio") && previousAudio.paused, "stopping sound when its selection is cleared");
            kinds("All types").click();

            // A runtime URL can stop working after the game loaded it. Exercise
            // the visible failure/retry state without editing the user's game.
            const originalPreviewAssets = useEditor.getState().previewAssets;
            useEditor.setState({ previewAssets: { ...originalPreviewAssets, assets: [...originalPreviewAssets.assets, { name: "unavailable-preview", kind: "sound", loader: "loadSound", url: new URL("/crew/missing-preview.wav", location.href).href }] } });
            assetView("In game").click();
            (await waitFor(() => document.querySelector('button[aria-label="Select unavailable-preview"]'), "unavailable runtime sound")).click();
            const soundFailure = () => document.querySelector('.asset-browser [role="alert"]');
            await waitFor(soundFailure, "visible sound failure", 10_000);
            assert(soundFailure().textContent.includes("Couldn't load this sound"), "Broken sounds must explain the failure.");
            const brokenAudio = document.querySelector(".asset-browser audio");
            let retriedSound = false;
            brokenAudio.addEventListener("loadstart", () => { retriedSound = true; }, { once: true });
            [...soundFailure().querySelectorAll("button")].find(button => button.textContent.trim() === "Retry sound").click();
            await waitFor(() => retriedSound && soundFailure(), "retrying a failed sound", 10_000);
            useEditor.setState({ previewAssets: originalPreviewAssets });
            document.querySelector('button[aria-label="Select pop"]').click();
            await waitFor(() => document.querySelector('audio[aria-label="Preview pop"]')?.readyState >= 1 && !soundFailure(), "clearing the error for a working game sound", 10_000);

            assetView("In game").click();
            await waitFor(() => document.querySelector('button[aria-label="Select pop"]'), "the starting game's loaded sound");
            assert(document.querySelector('button[aria-label="Select apple"]'), "In game omitted an asset loaded from a public path.");
            assert(document.querySelector('button[aria-label="Select bean"]'), "In game omitted loadBean().");
            assert(!document.querySelector('button[aria-label="Select ghosty"]'), "In game included an unused library sprite.");
            const loadedPop = await invoke("kaplayground_find_assets", { query: "pop", source: "game" });
            assert(loadedPop.assets.some(asset => asset.name === "pop" && asset.kind === "sound" && asset.loaded === true), "find_assets must include the running game's exact asset names.");
            assert(!JSON.stringify(loadedPop).includes("data:audio") && !loadedPop.assets.some(asset => "url" in asset), "Loaded-asset tool results exposed private media.");
            document.querySelector('button[aria-label="Select pop"]').click();
            const selectedRuntime = await invoke("kaplayground_inspect_game", {});
            assert(selectedRuntime.selectedAsset?.source === "runtime" && selectedRuntime.selectedAsset.name === "pop", "A loaded asset must retain its runtime identity when selected.");
            assert(selectedRuntime.loadedAssets.available && selectedRuntime.loadedAssets.assets.some(asset => asset.name === "apple"), "inspect_game must expose bounded loaded asset names.");
            document.querySelector('button[aria-label="Clear asset selection"]').click();
            assetView("Library").click();
            await waitFor(() => assetView("Library").getAttribute("aria-pressed") === "true", "returning to the library");
            Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value").set.call(search, "bean");
            search.dispatchEvent(new Event("input", { bubbles: true }));
            await delay(50);
            assert(useEditor.getState().previewRunId === initial.activeRunId, "Browsing loaded assets restarted the preview.");
            const panelTabs = [...document.querySelectorAll('[aria-label="Workspace panels"] [role="tab"]')];
            const activate = async label => {
                const button = panelTabs.find(button => button.textContent.trim() === label);
                button.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
                await waitFor(() => button.getAttribute("aria-selected") === "true", `${label} tab`);
            };
            panelTabs[0].focus();
            document.documentElement.dataset.webmcpPhase = "tabs-ready";
            await new Promise(resolve => { globalThis.__webmcpTabInputComplete = resolve; });
            await waitFor(() => useWorkspace.getState().activeTab === "code", "keyboard tab navigation");
            assert((await invoke("kaplayground_inspect_game", {})).editorVisible === true, "Inspection didn't reflect the Code tab.");
            initialEditor.setPosition({ lineNumber: 2, column: 1 });
            for (let index = 0; index < 3; index++) { await activate("Assets"); await activate("Code"); }
            assert(initialEditor.getPosition().lineNumber === 2, "Tab switching lost the cursor position.");
            await activate("Assets");
            const afterViews = await invoke("kaplayground_inspect_game", {});
            assert(afterViews.revision === initial.revision && afterViews.projectId === null && afterViews.saveStatus === "draft", "View/copy actions modified or saved a draft.");
            assert(afterViews.activeRunId === initial.activeRunId && initialIframe === document.querySelector("#game-view"), "Switching tabs restarted or replaced gameplay.");
            assert(useEditor.getState().runtime.editor === initialEditor && search.value === "bean", "Switching tabs lost panel state.");
            assert((await db.getAllKeys("projects")).length === 0, "View actions wrote a saved project.");
            const activityBeforePromotion = useWebMCPActivity.getState().entries.map(entry => entry.id);
            gameConsoleCapture.add({ timestamp: Date.now(), runId: initial.activeRunId, level: "log", values: ["before first save"] });
            const assetPath = "sprites/webmcp-fixture.svg";
            const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="40" height="20"><rect width="40" height="20" fill="#fff"/></svg>';
            const assets = new Map(useProject.getState().project.assets);
            assets.set(assetPath, {
                name: "webmcp-fixture.svg",
                kind: "sprite",
                path: assetPath,
                url: `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`,
                importFunction:
                    'loadSprite("webmcp-fixture", "assets/sprites/webmcp-fixture.svg", { sliceX: 2, sliceY: 1 });',
            });
            useProject.getState().setProject({ assets });
            await waitFor(() => useProject.getState().saveStatus === "saved", "first asset edit autosave");
            const firstProjectId = useProject.getState().projectKey;
            assert(typeof firstProjectId === "string" && (await db.getAllKeys("projects")).length === 1, "First edit must create exactly one saved project.");
            assertQuietSaveStatus();
            assert((await invoke("kaplayground_inspect_game", {})).saveStatus === "saved", "Hiding save labels changed agent-visible persistence state.");
            assert(useWebMCPActivity.getState().entries.some(entry => activityBeforePromotion.includes(entry.id)), "First save cleared Codex activity.");
            assert(useGameConsole.getState().entries.some(entry => entry.values.includes("before first save")), "First save cleared game messages.");
            assert(useProject.getState().project.sourceDemoKey === "webmcpAgent", "First save lost starter provenance.");

            const inspected = await invoke("kaplayground_inspect_game", {
                fileLimit: 100,
            });
            assert(typeof inspected.revision === "string", "inspect_game omitted a revision.");
            assert("activeRunId" in inspected, "inspect_game omitted the active run id.");
            assert("readiness" in inspected, "inspect_game omitted readiness.");

            const read = await invoke("kaplayground_read_files", {
                expectedRevision: inspected.revision,
                paths: ["main.js"],
            });
            assert(read.files.length === 1, "read_files did not return main.js.");

            const healthyMain = `
import { startFixture } from "./scenes/game.js";

startFixture();
`;
            const healthyScene = `
import { PLAYER_SPEED } from "./movement.js";

export function startFixture() {
    kaplay({
        width: 320,
        height: 240,
        background: [24, 28, 36],
    });

    const assetName = "runtime-" + "apple";
    loadSprite(assetName, "/sprites/apple.png");
    loadSound("runtime-pop", "/sounds/score.mp3");
    if (false) loadSprite("never-loaded", "/sprites/apple.png");

    scene("webmcp-ready-scene", () => {
        const player = add([
            rect(24, 32),
            pos(40, 120),
            area(),
            anchor("center"),
            color(96, 165, 250),
            "webmcp-player",
        ]);

        onKeyDown("right", () => player.move(PLAYER_SPEED, 0));
    });
    go("webmcp-ready-scene");
}
`;
            const movementSource = "export const PLAYER_SPEED = 180;\n";
            const updated = await invoke("kaplayground_update_game", {
                expectedRevision: inspected.revision,
                changes: [
                    {
                        action: "replace",
                        path: "main.js",
                        content: healthyMain,
                    },
                    {
                        action: fileAction(inspected, "scenes/game.js"),
                        path: "scenes/game.js",
                        content: healthyScene,
                    },
                    {
                        action: fileAction(inspected, "scenes/movement.js"),
                        path: "scenes/movement.js",
                        content: movementSource,
                    },
                ],
                focusPath: "main.js",
            });
            assert(updated.committed === true, "update_game was not committed.");
            assert(useWorkspace.getState().activeTab === "assets", "focusPath activated Code.");
            assert(useEditor.getState().previewRunId === initial.activeRunId, "Updating hidden code restarted gameplay.");
            await waitFor(() => useProject.getState().saveStatus === "saved", "hidden-editor update autosave");
            assert(useProject.getState().projectKey === firstProjectId, "A subsequent edit created another project.");
            let atomicRejected = false;
            try {
                await invoke("kaplayground_update_game", { expectedRevision: updated.revision, changes: [
                    { action: "replace", path: "main.js", content: "broken" },
                    { action: "create", path: "../unsafe.js", content: "bad" },
                ] });
            } catch { atomicRejected = true; }
            assert(atomicRejected && useProject.getState().getMainFile().value === healthyMain, "A rejected atomic update changed code.");
            let staleRejected = false;
            try { await invoke("kaplayground_save_game", { expectedRevision: inspected.revision }); } catch { staleRejected = true; }
            assert(staleRejected, "Stale save revisions must be rejected.");

            const dimensions = await invoke("kaplayground_find_assets", {
                query: "webmcp-fixture",
                kind: "sprite",
                source: "game",
                limit: 10,
            });
            const dimensionAsset = dimensions.assets.find(asset =>
                asset.path === assetPath
            );
            assert(dimensionAsset, "find_assets omitted the fixture sprite.");
            assert(
                dimensionAsset.imageDimensions?.width === 40
                    && dimensionAsset.imageDimensions?.height === 20,
                "find_assets returned incorrect image dimensions.",
            );
            assert(
                dimensionAsset.spriteFrameDimensions?.width === 20
                    && dimensionAsset.spriteFrameDimensions?.height === 20,
                "find_assets returned incorrect sprite-frame dimensions.",
            );

            const run = await invoke("kaplayground_run_game", {
                expectedRevision: updated.revision,
                mode: "restart-and-check",
                inspectTag: "webmcp-player",
                focus: true,
                consoleLimit: 20,
                objectLimit: 10,
            });

            // Feature lessons and prompts remain available without WebMCP.
            const beforeFeatureCount = (await db.getAllKeys("projects")).length;
            chooser.value = "starter:spriteAnim";
            chooser.dispatchEvent(new Event("change", { bubbles: true }));
            await waitFor(() => useProject.getState().demoKey === "spriteAnim" && useEditor.getState().previewRunId !== layoutRunId && useEditor.getState().previewReadiness?.status === "ready", "the sprite animation sample");
            const coach = document.querySelector('aside[aria-label="Codex tips"]');
            await waitFor(() => coach.textContent.includes("named frame sequences"), "the visible feature explanation");
            const featureRevision = useProject.getState().projectRevision;
            const featureRun = useEditor.getState().previewRunId;
            coach.querySelector('button[aria-label^="Go to idea 2:"]').click();
            await waitFor(() => coach.textContent.includes("Copy for Codex"), "feature-specific prompt");
            assert(coach.textContent.includes("named frame sequences"), "The explanation must stay alongside its prompt.");
            const tipCopies = [];
            const copyCommand = document.execCommand;
            document.execCommand = command => {
                if (command !== "copy") return false;
                tipCopies.push(document.activeElement.value);
                return true;
            };
            navigator.clipboard.writeText = async text => tipCopies.push(text);
            const copyTipButton = [...coach.querySelectorAll("button")].find(button => button.textContent.trim() === "Copy for Codex");
            copyTipButton.focus();
            copyTipButton.click();
            await waitFor(() => tipCopies.length === 1, "copying a feature prompt");
            assert(document.activeElement === copyTipButton, "Copying an idea lost keyboard focus.");
            document.execCommand = () => false;
            copyTipButton.click();
            await waitFor(() => tipCopies.length === 2, "the clipboard fallback for feature prompts");
            document.execCommand = copyCommand;
            navigator.clipboard.writeText = clipboardWrite;
            assert(tipCopies[0] === tipCopies[1], "Clipboard paths copied different prompts.");
            assert(tipCopies[0].includes("dinosaur") && tipCopies[0].includes("frame sequences"), "The prompt is not grounded in the chosen feature sample.");

            // Clipboard denial must leave the complete idea available to select.
            document.execCommand = () => { throw new Error("Legacy clipboard blocked"); };
            navigator.clipboard.writeText = async text => tipCopies.push(text);
            copyTipButton.click();
            await waitFor(() => tipCopies.length === 3, "clipboard fallback after a thrown legacy copy");
            assert(tipCopies[2] === tipCopies[0], "The thrown-copy fallback changed the idea.");
            document.execCommand = () => false;
            navigator.clipboard.writeText = async () => { throw new Error("Clipboard denied"); };
            copyTipButton.click();
            const manualPrompt = await waitFor(() => coach.querySelector('textarea[aria-label="Prompt to copy"]'), "a selectable full prompt after clipboard denial");
            assert(manualPrompt.readOnly && manualPrompt.value === tipCopies[0], "The manual-copy fallback doesn't expose the whole idea.");
            assert(document.activeElement === manualPrompt && manualPrompt.selectionEnd === manualPrompt.value.length, "Manual copying must focus and select the full idea.");

            // A slow clipboard response belongs to the idea that requested it.
            coach.querySelector('button[aria-label^="Go to idea 3:"]').click();
            await waitFor(() => coach.textContent.includes("Give it your own look"), "the remix idea");
            let releaseTipCopy;
            navigator.clipboard.writeText = () => new Promise(resolve => { releaseTipCopy = resolve; });
            [...coach.querySelectorAll("button")].find(button => button.textContent.trim() === "Copy for Codex").click();
            await waitFor(() => releaseTipCopy, "a pending clipboard request");
            coach.querySelector('button[aria-label^="Go to idea 4:"]').click();
            await waitFor(() => coach.textContent.includes("Turn this idea into a tiny game"), "moving on during a pending copy");
            releaseTipCopy();
            await delay(50);
            assert(!coach.textContent.includes("Copied —"), "An old clipboard request marked a different idea as copied.");
            document.execCommand = copyCommand;
            navigator.clipboard.writeText = clipboardWrite;
            coach.querySelector('button[aria-label^="Go to idea 2:"]').click();
            await waitFor(() => coach.textContent.includes("Understand it, then change it"), "returning to the explanation");
            coach.querySelector('[aria-label="Hide Codex ideas"]').click();
            await waitFor(() => document.querySelector('aside[aria-label="Codex tips"]')?.textContent.includes("Show Codex ideas"), "collapsing the bottom tips");
            document.querySelector('aside[aria-label="Codex tips"] button').click();
            await waitFor(() => document.querySelector('aside[aria-label="Codex tips"]')?.textContent.includes("Understand it, then change it"), "remembering the tip step after reopening");
            assert(useProject.getState().projectRevision === featureRevision && useProject.getState().projectKey === null && useProject.getState().saveStatus === "draft", "Reading or copying tips edited/saved the sample.");
            assert(useEditor.getState().previewRunId === featureRun, "Reading or collapsing tips restarted the sample.");
            assert((await db.getAllKeys("projects")).length === beforeFeatureCount, "A feature sample was saved without an edit.");

            // Launch the actual game catalog, not only the integration fixture.
            // This also checks loading and visible error capture without WebMCP.
            const gameStarters = demos.filter(isPlayableStartingPoint);
            const regressionStarters = demos.filter(sample => ["advancedbinding", "loadingScreen"].includes(sample.key));
            const gameStartups = [];
            await activate("Assets");
            for (const starter of [...gameStarters, ...regressionStarters]) {
                const previousRun = useEditor.getState().previewRunId;
                chooser.value = `starter:${starter.key}`;
                chooser.dispatchEvent(new Event("change", { bubbles: true }));
                const errors = () => useGameConsole.getState().entries.filter(entry => entry.level === "error");
                await waitFor(() => {
                    const preview = useEditor.getState();
                    return useProject.getState().demoKey === starter.key && (
                        errors().length > 0 ||
                        (preview.previewRunId !== null && preview.previewRunId !== previousRun && preview.previewReadiness !== null)
                    );
                }, `starting ${starter.formattedName}`);
                await delay(starter.key === "eatlove" ? 1_600 : 250);
                const preview = useEditor.getState();
                const errorMessages = errors();
                assert(!preview.stopped && preview.previewReadiness?.status === "ready" && errorMessages.length === 0,
                    `${starter.formattedName} failed to start: ${JSON.stringify({ readiness: preview.previewReadiness, errors: errorMessages })}`);
                assert(useWorkspace.getState().activeTab === "assets", `${starter.formattedName} opened the editor while starting.`);
                assert(useProject.getState().projectKey === null && useProject.getState().saveStatus === "draft", `${starter.formattedName} was saved just by playing.`);
                assert(useProject.getState().project.kaplayVersion === starter.version, `${starter.formattedName} changed its engine version.`);
                gameStartups.push({ key: starter.key, ready: true, errorCount: errorMessages.length });
            }
            assert((await db.getAllKeys("projects")).length === beforeFeatureCount, "Starting the game catalog created saved projects.");

            // Collect every startup outcome so the optional catalog gate can
            // report all broken samples together. Prompt wiring is checked
            // for every sample and idea, including examples with no controls.
            const catalogAudit = [];
            if (auditCatalog) {
                const { EXAMPLE_COACH_PROMPTS } = await import("/src/integrations/webmcp/exampleCoachPrompts.ts");
                const { CODEX_PLAY_STEPS } = await import("/src/integrations/webmcp/agentGuide.ts");
                const { createCodexPlayGuideForContext } = await import("/src/integrations/webmcp/codexPlayContext.ts");
                for (const sample of demos) {
                    const previousRun = useEditor.getState().previewRunId;
                    chooser.value = `starter:${sample.key}`;
                    chooser.dispatchEvent(new Event("change", { bubbles: true }));
                    let startupError = null;
                    try {
                        await waitFor(() => {
                            const preview = useEditor.getState();
                            return useProject.getState().demoKey === sample.key
                                && (useGameConsole.getState().entries.some(entry => entry.level === "error")
                                    || (preview.previewRunId !== previousRun && preview.previewReadiness !== null));
                        }, `auditing ${sample.key}`, 10_000);
                        await delay(300);
                    } catch (error) {
                        startupError = error.message;
                    }
                    assert(useProject.getState().demoKey === sample.key, `The chooser didn't open ${sample.key}.`);
                    const state = useProject.getState();
                    const preview = useEditor.getState();
                    const guide = createCodexPlayGuideForContext({
                        demoKey: state.demoKey,
                        projectKey: state.projectKey,
                        projectName: state.project.name,
                        projectCreatedAt: state.project.createdAt,
                        projectSource: sample.code,
                    });
                    const expectedPrompts = sample.key === "webmcpAgent"
                        ? CODEX_PLAY_STEPS.slice(1).map(step => step.prompt)
                        : Object.values(EXAMPLE_COACH_PROMPTS[sample.key]);
                    const copies = [];
                    document.execCommand = command => {
                        if (command !== "copy") return false;
                        copies.push(document.activeElement.value);
                        return true;
                    };
                    try {
                        const tips = document.querySelector('aside[aria-label="Codex tips"]');
                        for (let index = 0; index < 4; index++) {
                            tips.querySelector(`button[aria-label^="Go to idea ${index + 2}:"]`).click();
                            await waitFor(() => tips.textContent.includes(expectedPrompts[index]), `${sample.key} idea ${index + 2}`);
                            [...tips.querySelectorAll("button")].find(button => button.textContent.trim() === "Copy for Codex").click();
                            await waitFor(() => copies.length === index + 1, `copying ${sample.key} idea ${index + 2}`);
                            assert(copies[index] === expectedPrompts[index], `${sample.key} copied the wrong idea ${index + 2}.`);
                        }
                    } finally {
                        document.execCommand = copyCommand;
                    }
                    assert(useProject.getState().projectKey === null && useProject.getState().saveStatus === "draft", `${sample.key} was saved by reading its ideas.`);
                    assert(useProject.getState().projectRevision === state.projectRevision && useEditor.getState().previewRunId === preview.previewRunId, `${sample.key} changed or restarted while copying an idea.`);
                    catalogAudit.push({
                        key: sample.key,
                        title: sample.formattedName,
                        presentation: guide.presentation,
                        readiness: preview.previewReadiness,
                        stopped: preview.stopped,
                        startupError,
                        errors: useGameConsole.getState().entries.filter(entry => entry.level === "error").slice(0, 5),
                        copiedPrompts: copies.length,
                    });
                    console.log(`Catalog audit ${catalogAudit.length}/${demos.length}: ${sample.key}`);
                }
            }

            // Going home must finish pending persistence before replacing the game.
            const beforeHome = useProject.getState();
            const homeSource = beforeHome.getMainFile().value + "\n// save before going home";
            let releaseHomeWrite;
            const homeWriteGate = new Promise(resolve => { releaseHomeWrite = resolve; });
            db.put = async (...args) => {
                if (args[0] === "projects") await homeWriteGate;
                return originalPut(...args);
            };
            beforeHome.updateFile("main.js", homeSource);
            homeLink.click();
            await delay(50);
            assert(useProject.getState().projectGeneration === beforeHome.projectGeneration && useProject.getState().saveStatus === "saving", "The home link replaced the game before saving its edits.");
            releaseHomeWrite();
            await waitFor(() => useProject.getState().projectGeneration !== beforeHome.projectGeneration && useProject.getState().demoKey === "webmcpAgent", "returning home after saving");
            db.put = originalPut;
            const savedBeforeHome = await db.get("projects", beforeHome.draftProjectId);
            assert(savedBeforeHome.files.get("main.js").value === homeSource && savedBeforeHome.sourceDemoKey === beforeHome.demoKey, "Going home lost pending edits or starter provenance.");
            assert((await db.getAllKeys("projects")).length === beforeFeatureCount + 1, "Going home created extra saved projects.");
            assert(useProject.getState().projectKey === null && useProject.getState().saveStatus === "draft", "Going home saved the untouched Codex starting point.");

            finish({
                passed: true,
                registered: registeredNames,
                runStatus: run.status,
                currentCheckStatus: checked.status,
                readinessStatus: run.readiness.status,
                sceneTransitionConfirmed: run.scene.scene === "webmcp-ready-scene",
                canceledUnloadConfirmed: canceledInspection.revision === updated.revision,
                focusConfirmed: run.focus.canvasFocused,
                movementConfirmed: movedPlayer.position.x > initialPlayer.position.x,
                dimensionsConfirmed: true,
                saveReopenConfirmed: reopened.projectId === saved.projectId,
                readOnlyAssetsConfirmed: true,
                hiddenEditorConfirmed: true,
                failedSaveRetryConfirmed: true,
                firstSaveActivityConfirmed: true,
                sharedConsoleConfirmed: true,
                legacyProjectsConfirmed: true,
                pendingNavigationConfirmed: true,
                explicitDraftSaveConfirmed: true,
                deleteQueueConfirmed: true,
                restoredBrowserConfirmed: true,
                quickSwitchConfirmed: true,
                toolbarShortcutsConfirmed: true,
                homeNavigationConfirmed: true,
                quietSaveStatusConfirmed: true,
                autosaveFeedbackConfirmed: true,
                soundPreviews,
                soundFailureRetryConfirmed: true,
                saveErrorRetryConfirmed: true,
                featureTipsConfirmed: true,
                assetPathsConfirmed: true,
                gameStarterCount: gameStarters.length,
                regressionStarterCount: regressionStarters.length,
                gameStartups,
                catalogAudit,
                catalogExpectedCount: auditCatalog ? demos.length : 0,
                pendingAssetsStatus: pendingRun.status,
                inspectionErrorStatus: inspectionErrorRun.status,
                diagnosticErrorStatus: diagnosticRun.status,
                unavailableInspectionStatus: unavailableRun.status,
                declinedCommitted: declined.committed,
                opened: opened.opened,
            });
        } catch (error) {
            finish({
                passed: false,
                error: error instanceof Error
                    ? `${error.name}: ${error.message}\n${error.stack ?? ""}`
                    : String(error),
                registered: registeredNames,
            });
        }
        </script>
    </body>
</html>
