<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KAPLAY WebMCP running-game example</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { margin: 0; padding: 2rem; background: #101411; color: #f5f7f5; }
      main { width: min(640px, 100%); margin: 0 auto; }
      canvas { display: block; width: 100%; height: auto; border-radius: 0.75rem; }
      #status { color: #b6ff75; }
    </style>
  </head>
  <body>
    <main>
      <h1>KAPLAY WebMCP</h1>
      <p>Move the square with the arrow keys or call <code>kaplay_move_player</code>.</p>
      <p id="status" aria-live="polite">Registering browser-agent tools…</p>
      <canvas id="game" aria-label="Movable KAPLAY square"></canvas>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
