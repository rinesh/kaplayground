<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Game Preview</title>
        <meta name="robots" content="noindex">
        <base target="_blank">
        <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            width: 100%;
            height: 100vh;
        }

        body {
            overflow: hidden;
            background: #121419;
        }
        </style>
    </head>

    <body>
        <script type="module">
        import * as HookModule from "console-feed/lib/Hook";
        import * as UnhookModule from "console-feed/lib/Unhook";

        const Hook = resolveConsoleFeedExport(HookModule);
        const Unhook = resolveConsoleFeedExport(UnhookModule);

        const PARENT_ORIGIN = document.referrer
            ? new URL(document.referrer).origin
            : null;

        const MAX_INSPECTION_OBJECTS = 50;
        const MAX_INSPECTION_TAG_LENGTH = 128;
        const MAX_TAGS_PER_OBJECT = 20;
        const MAX_OBJECT_STRING_LENGTH = 256;
        const PREVIEW_PROTOCOL_VERSION = 2;
        const RUN_LOADED_CALLBACK = "__kaplaygroundModuleLoaded";
        const RUN_CONTEXT_CALLBACK = "__kaplaygroundCaptureContext";
        const RUN_READINESS_TIMEOUT_MS = Math.max(
            100,
            Number(import.meta.env.VITE_WEBMCP_READINESS_TIMEOUT_MS) || 10_000,
        );

        let activeRunId = null;
        let activeContext = null;
        let trackedContext = null;
        let activeReadiness = createReadiness();
        let readinessPromise = Promise.resolve(readinessSnapshot());
        let readinessResolve = null;
        let readinessTimer = null;

        Object.defineProperty(globalThis, RUN_CONTEXT_CALLBACK, {
            configurable: false,
            enumerable: false,
            writable: false,
            value: context => captureContext(context),
        });

        consoleHook(true);
        window.addEventListener("error", event => {
            const message = event?.error?.message ?? event?.message;
            if (message) console.error(message);
        });
        window.addEventListener("unhandledrejection", event => {
            console.error("Unhandled promise rejection:", errorText(event.reason));
        });

        const executeCode = (code, runId) => {
            activeRunId = runId;
            resetReadiness(runId);
            console.groupCollapsed("[sandbox] Received code update");
            console.log("[sandbox] Run:", runId);
            console.log("[sandbox] Code:", code);
            console.groupEnd();

            document.querySelectorAll("script[data-preview-run]")
                .forEach(script => script.remove());

            const script = document.createElement("script");
            script.type = "module";
            script.dataset.previewRun = runId;
            let settled = false;
            let moduleReported = false;

            const cleanup = () => {
                script.removeEventListener("error", moduleError);
                window.removeEventListener("error", runtimeError, true);
                window.removeEventListener("unhandledrejection", rejection);
                if (globalThis[RUN_LOADED_CALLBACK] === moduleLoaded) {
                    delete globalThis[RUN_LOADED_CALLBACK];
                }
            };
            const finish = (result) => {
                if (settled) return;
                settled = true;
                cleanup();
                postParent(result);
            };
            const fail = (error) => {
                if (settled) return;
                const message = errorText(error);
                markReadinessUnavailable(message);
                console.error("Error executing code:", message);
                finish({
                    type: "RUN_RESULT",
                    runId,
                    status: "failed",
                    paused: readPaused(),
                    readiness: readinessSnapshot(),
                    error: message,
                });
            };
            const moduleLoaded = (completedRunId) => {
                if (completedRunId !== runId || moduleReported) return;
                moduleReported = true;
                activeReadiness.moduleExecuted = true;
                trackActiveContext();
                maybeCompleteReadiness();
                void waitForReadiness(runId).then(readiness => {
                    finish({
                        type: "RUN_RESULT",
                        runId,
                        status: "loaded",
                        paused: readPaused(),
                        readiness,
                    });
                });
            };
            const moduleError = () => {
                fail("The preview module failed to load.");
            };
            const runtimeError = (event) => {
                fail(event?.error ?? event?.message ?? "Preview execution failed.");
            };
            const rejection = (event) => {
                fail(event.reason ?? "Preview execution rejected.");
            };

            globalThis[RUN_LOADED_CALLBACK] = moduleLoaded;
            script.addEventListener("error", moduleError, { once: true });
            window.addEventListener("error", runtimeError, {
                capture: true,
                once: true,
            });
            window.addEventListener("unhandledrejection", rejection, {
                once: true,
            });
            const callbackName = JSON.stringify(RUN_LOADED_CALLBACK);
            const callbackRunId = JSON.stringify(runId);
            script.textContent =
                `${code}\n;globalThis[${callbackName}]?.(${callbackRunId});\n`;
            document.body.appendChild(script);
        };

        const messageEventHandlers = {
            UPDATE_CODE({ code, runId }) {
                if (typeof code !== "string" || typeof runId !== "string") {
                    return;
                }
                void executeCode(code, runId);
            },

            REFRESH() {
                console.log("[sandbox] Refreshing the page");
                window.location.reload();
            },

            SET_PAUSED({ requestId, runId, paused }) {
                if (
                    typeof requestId !== "string"
                    || typeof runId !== "string"
                    || typeof paused !== "boolean"
                ) {
                    return;
                }

                if (runId !== activeRunId) {
                    postParent({
                        type: "PAUSE_RESULT",
                        requestId,
                        runId: activeRunId,
                        paused: readPaused(),
                        error: "The requested preview run is no longer active.",
                    });
                    return;
                }

                try {
                    const actualPaused = setPaused(paused);
                    postParent({
                        type: "PAUSE_RESULT",
                        requestId,
                        runId: activeRunId,
                        paused: actualPaused,
                    });
                } catch (error) {
                    postParent({
                        type: "PAUSE_RESULT",
                        requestId,
                        runId: activeRunId,
                        paused: readPaused(),
                        error: errorText(error),
                    });
                }
            },

            // Compatibility for the existing toolbar and older parent clients.
            PAUSE() {
                const paused = readPaused();
                if (paused === null) return;
                setPaused(!paused);
            },

            INSPECT_RUNTIME({ requestId, runId, tag, limit }) {
                if (typeof requestId !== "string" || typeof runId !== "string") {
                    return;
                }

                if (runId !== activeRunId) {
                    postParent({
                        type: "RUNTIME_INSPECTION_RESULT",
                        requestId,
                        runId: activeRunId,
                        error: "The requested preview run is no longer active.",
                    });
                    return;
                }

                try {
                    postParent({
                        type: "RUNTIME_INSPECTION_RESULT",
                        requestId,
                        runId: activeRunId,
                        inspection: inspectRuntime({ tag, limit }),
                    });
                } catch (error) {
                    postParent({
                        type: "RUNTIME_INSPECTION_RESULT",
                        requestId,
                        runId: activeRunId,
                        error: errorText(error),
                    });
                }
            },

            FOCUS() {
                console.log("[sandbox] Focusing the game");
                const canvas = document.querySelector("canvas");
                if (!canvas) return;
                if (!canvas.hasAttribute("tabindex")) canvas.tabIndex = 0;
                canvas.focus({ preventScroll: true });
            },

            TOGGLE_CONSOLE() {
                // The preference controls parent-side presentation only.
                // WebMCP capture remains active for agent verification.
            },
        };

        window.addEventListener("message", (event) => {
            if (event.origin !== PARENT_ORIGIN || event.source !== window.parent) {
                return;
            }
            messageEventHandlers[event.data?.type]?.(event.data);
        });

        window.addEventListener("load", () => {
            postParent({
                type: "READY",
                protocolVersion: PREVIEW_PROTOCOL_VERSION,
            });
        });

        function createReadiness() {
            return {
                status: "pending",
                moduleExecuted: false,
                contextCaptured: false,
                assetsLoaded: false,
                firstFrame: false,
                canvasPresent: false,
                reason: null,
            };
        }

        function resetReadiness(runId) {
            if (readinessTimer !== null) window.clearTimeout(readinessTimer);
            activeContext = null;
            trackedContext = null;
            activeReadiness = createReadiness();
            readinessPromise = new Promise(resolve => {
                readinessResolve = resolve;
            });
            readinessTimer = window.setTimeout(() => {
                if (runId !== activeRunId || activeReadiness.status === "ready") {
                    return;
                }
                activeReadiness.status = activeReadiness.contextCaptured
                    ? "timed-out"
                    : "unavailable";
                activeReadiness.reason = activeReadiness.contextCaptured
                    ? readinessTimeoutReason()
                    : "KAPLAY context capture was unavailable before the loading timeout.";
                settleReadinessWaiter();
            }, RUN_READINESS_TIMEOUT_MS);
        }

        function captureContext(context) {
            if (!context || activeRunId === null) return;
            activeContext = context;
            window._k_ctx = context;
            window._k_debug = context?.debug ?? null;
            activeReadiness.contextCaptured = true;
            activeReadiness.canvasPresent = Boolean(
                context?.canvas ?? document.querySelector("canvas"),
            );
            trackActiveContext();
            maybeCompleteReadiness();
        }

        function trackActiveContext() {
            const context = activeContext;
            if (
                !activeReadiness.moduleExecuted
                || !context
                || trackedContext === context
            ) {
                return;
            }
            trackedContext = context;
            const runId = activeRunId;

            safeInvoke(() => context.onDraw?.(() => {
                if (runId !== activeRunId || context !== activeContext) return;
                activeReadiness.firstFrame = true;
                activeReadiness.canvasPresent = Boolean(
                    context?.canvas ?? document.querySelector("canvas"),
                );
                maybeCompleteReadiness();
            }));
            safeInvoke(() => context.onLoad?.(() => {
                if (runId !== activeRunId || context !== activeContext) return;
                activeReadiness.assetsLoaded = true;
                maybeCompleteReadiness();
            }));

            const loadProgress = finiteNumber(
                safeInvoke(() => context.loadProgress?.()),
            );
            if (loadProgress !== null && loadProgress >= 1) {
                activeReadiness.assetsLoaded = true;
            }
            maybeCompleteReadiness();
        }

        function maybeCompleteReadiness() {
            activeReadiness.canvasPresent = activeReadiness.canvasPresent
                || Boolean(document.querySelector("canvas"));
            if (
                !activeReadiness.moduleExecuted
                || !activeReadiness.contextCaptured
                || !activeReadiness.assetsLoaded
                || !activeReadiness.firstFrame
                || !activeReadiness.canvasPresent
            ) {
                return;
            }
            activeReadiness.status = "ready";
            activeReadiness.reason = null;
            settleReadinessWaiter();
        }

        function markReadinessUnavailable(reason) {
            if (readinessTimer !== null) {
                window.clearTimeout(readinessTimer);
                readinessTimer = null;
            }
            if (activeReadiness.status !== "ready") {
                activeReadiness.status = "unavailable";
                activeReadiness.reason = boundedString(String(reason), 2_000);
            }
            settleReadinessWaiter();
        }

        function settleReadinessWaiter() {
            if (readinessTimer !== null && activeReadiness.status === "ready") {
                window.clearTimeout(readinessTimer);
                readinessTimer = null;
            }
            const resolve = readinessResolve;
            readinessResolve = null;
            resolve?.(readinessSnapshot());
        }

        function waitForReadiness(runId) {
            if (runId !== activeRunId) {
                return Promise.resolve({
                    ...readinessSnapshot(),
                    status: "unavailable",
                    reason: "The preview run changed before readiness was reported.",
                });
            }
            if (activeReadiness.status !== "pending") {
                return Promise.resolve(readinessSnapshot());
            }
            return readinessPromise;
        }

        function readinessSnapshot() {
            return { ...activeReadiness };
        }

        function readinessTimeoutReason() {
            const missing = [];
            if (!activeReadiness.assetsLoaded) missing.push("asset loading");
            if (!activeReadiness.firstFrame) missing.push("a first game frame");
            if (!activeReadiness.canvasPresent) missing.push("a preview canvas");
            return `Timed out waiting for ${missing.join(", ") || "readiness"}.`;
        }

        function setPaused(paused) {
            const debug = getDebug();
            if (!debug || typeof debug.paused !== "boolean") {
                throw new Error("The running game does not expose KAPLAY debug state.");
            }

            console.log(`[sandbox] ${paused ? "Pausing" : "Resuming"} the game`);
            debug.paused = paused;
            const actualPaused = readPaused();
            if (actualPaused === null) {
                throw new Error("KAPLAY did not report its pause state.");
            }
            return actualPaused;
        }

        function readPaused() {
            const debug = getDebug();
            return typeof debug?.paused === "boolean" ? debug.paused : null;
        }

        function getDebug() {
            return window._k_ctx?.debug ?? window.debug ?? window._k_debug ?? null;
        }

        function inspectRuntime({ tag, limit }) {
            const normalizedTag = normalizeInspectionTag(tag);
            const normalizedLimit = normalizeInspectionLimit(limit);
            const canvas = document.querySelector("canvas");
            const debug = getDebug();
            const scene = safeCall("getSceneName");
            const viewportWidth = finiteNumber(safeCall("width"))
                ?? finiteNumber(canvas?.width);
            const viewportHeight = finiteNumber(safeCall("height"))
                ?? finiteNumber(canvas?.height);
            const cameraPosition = pointSnapshot(safeCall("camPos"));
            const cameraScale = pointSnapshot(safeCall("camScale"));
            const cameraRotation = finiteNumber(safeCall("camRot"));
            const matchedObjects = queryObjects(normalizedTag);
            const objectsAvailable = matchedObjects !== null;
            const objectCount = matchedObjects
                ? matchedObjects.length
                : normalizedTag === undefined && typeof debug?.numObjects === "function"
                ? finiteNumber(safeInvoke(() => debug.numObjects()))
                : null;
            const objects = matchedObjects
                ? matchedObjects.slice(0, normalizedLimit).map(snapshotObject)
                : [];
            const hasCamera = cameraPosition !== null
                || cameraScale !== null
                || cameraRotation !== null;
            const canvasFocused = Boolean(
                canvas
                    && (
                        document.activeElement === canvas
                        || safeCall("isFocused") === true
                    ),
            );

            return {
                runId: activeRunId,
                available: Boolean(
                    debug
                        || canvas
                        || scene !== undefined
                        || matchedObjects,
                ),
                readiness: readinessSnapshot(),
                canvasFocused,
                scene: typeof scene === "string" ? boundedString(scene, 256) : null,
                paused: readPaused(),
                viewport: viewportWidth !== null && viewportHeight !== null
                    ? { width: viewportWidth, height: viewportHeight }
                    : null,
                camera: hasCamera
                    ? {
                        position: cameraPosition,
                        scale: cameraScale,
                        rotation: cameraRotation,
                    }
                    : null,
                objectsAvailable,
                objectCount,
                objects,
                objectsTruncated: objectCount !== null && objects.length < objectCount,
            };
        }

        function queryObjects(tag) {
            const queryTag = tag ?? "*";
            const result = safeCall("get", queryTag, { recursive: true });
            if (Array.isArray(result)) return result;

            const root = safeCall("getTreeRoot");
            const rootResult = safeInvoke(() =>
                typeof root?.get === "function"
                    ? root.get(queryTag, { recursive: true })
                    : undefined
            );
            return Array.isArray(rootResult) ? rootResult : null;
        }

        function snapshotObject(object) {
            const tags = safeRead(object, "tags");
            const snapshot = {
                id: primitiveId(safeRead(object, "id")),
                tags: Array.isArray(tags)
                    ? tags
                        .filter(tag => typeof tag === "string")
                        .slice(0, MAX_TAGS_PER_OBJECT)
                        .map(tag => boundedString(tag, 64))
                    : [],
            };
            const position = pointSnapshot(safeRead(object, "pos"));
            const scale = pointSnapshot(safeRead(object, "scale"));
            const angle = finiteNumber(safeRead(object, "angle"));
            const opacity = finiteNumber(safeRead(object, "opacity"));
            const hidden = safeRead(object, "hidden");
            const paused = safeRead(object, "paused");
            const text = safeRead(object, "text");
            const sprite = safeRead(object, "sprite");
            const anchor = anchorSnapshot(safeRead(object, "anchor"));
            const renderedBounds = renderedBoundsSnapshot(object);
            const collisionBounds = collisionBoundsSnapshot(object);

            if (position) snapshot.position = position;
            if (scale) snapshot.scale = scale;
            if (angle !== null) snapshot.angle = angle;
            if (opacity !== null) snapshot.opacity = opacity;
            if (typeof hidden === "boolean") snapshot.hidden = hidden;
            if (typeof paused === "boolean") snapshot.paused = paused;
            if (typeof text === "string") {
                snapshot.text = boundedString(text, MAX_OBJECT_STRING_LENGTH);
            }
            if (typeof sprite === "string") {
                snapshot.sprite = boundedString(sprite, MAX_OBJECT_STRING_LENGTH);
            }
            if (anchor) snapshot.anchor = anchor;
            if (renderedBounds) snapshot.renderedBounds = renderedBounds;
            if (collisionBounds) snapshot.collisionBounds = collisionBounds;
            return snapshot;
        }

        function renderedBoundsSnapshot(object) {
            const reported = boundsSnapshot(safeMethod(object, "renderArea"));
            if (reported) return reported;

            const width = finiteNumber(safeRead(object, "width"));
            const height = finiteNumber(safeRead(object, "height"));
            if (width === null || height === null) return null;
            const anchor = anchorSnapshot(safeRead(object, "anchor"));
            const offset = anchorOffset(anchor, width, height);
            return { x: offset.x, y: offset.y, width, height };
        }

        function collisionBoundsSnapshot(object) {
            const local = boundsSnapshot(safeMethod(object, "localArea"));
            const world = boundsSnapshot(safeMethod(object, "worldArea"));
            const screen = boundsSnapshot(safeMethod(object, "screenArea"));
            return local || world || screen ? { local, world, screen } : null;
        }

        function boundsSnapshot(value, allowBoundingBox = true) {
            if (!value || typeof value !== "object") return null;
            if (allowBoundingBox) {
                const boundingBox = safeMethod(value, "bbox");
                if (boundingBox && boundingBox !== value) {
                    const bounds = boundsSnapshot(boundingBox, false);
                    if (bounds) return bounds;
                }
            }

            const position = pointSnapshot(safeRead(value, "pos"))
                ?? pointSnapshot(value);
            const width = finiteNumber(safeRead(value, "width"));
            const height = finiteNumber(safeRead(value, "height"));
            if (position && width !== null && height !== null) {
                return { x: position.x, y: position.y, width, height };
            }

            const center = pointSnapshot(safeRead(value, "center")) ?? position;
            const radius = finiteNumber(safeRead(value, "radius"));
            if (center && radius !== null) {
                return {
                    x: center.x - radius,
                    y: center.y - radius,
                    width: radius * 2,
                    height: radius * 2,
                };
            }

            const points = safeRead(value, "pts") ?? safeRead(value, "points");
            if (Array.isArray(points)) return boundsFromPoints(points);
            const p1 = pointSnapshot(safeRead(value, "p1"));
            const p2 = pointSnapshot(safeRead(value, "p2"));
            return p1 && p2 ? boundsFromPoints([p1, p2]) : null;
        }

        function boundsFromPoints(values) {
            const points = values.map(pointSnapshot).filter(Boolean);
            if (points.length === 0) return null;
            const xs = points.map(point => point.x);
            const ys = points.map(point => point.y);
            const left = Math.min(...xs);
            const top = Math.min(...ys);
            return {
                x: left,
                y: top,
                width: Math.max(...xs) - left,
                height: Math.max(...ys) - top,
            };
        }

        function anchorSnapshot(value) {
            if (typeof value === "string") return boundedString(value, 64);
            return pointSnapshot(value);
        }

        function anchorOffset(anchor, width, height) {
            const named = {
                center: { x: -width / 2, y: -height / 2 },
                top: { x: -width / 2, y: 0 },
                topleft: { x: 0, y: 0 },
                topright: { x: -width, y: 0 },
                left: { x: 0, y: -height / 2 },
                right: { x: -width, y: -height / 2 },
                bot: { x: -width / 2, y: -height },
                botleft: { x: 0, y: -height },
                botright: { x: -width, y: -height },
            };
            if (typeof anchor === "string") return named[anchor] ?? named.topleft;
            if (anchor) {
                return {
                    x: -width * (anchor.x + 1) / 2,
                    y: -height * (anchor.y + 1) / 2,
                };
            }
            return named.topleft;
        }

        function safeCall(name, ...args) {
            const context = window._k_ctx;
            const contextMethod = context?.[name];
            if (typeof contextMethod === "function") {
                return safeInvoke(() => contextMethod.apply(context, args));
            }

            const globalMethod = window[name];
            return typeof globalMethod === "function"
                ? safeInvoke(() => globalMethod(...args))
                : undefined;
        }

        function safeMethod(object, name, ...args) {
            return safeInvoke(() => {
                const method = object?.[name];
                return typeof method === "function"
                    ? method.apply(object, args)
                    : undefined;
            });
        }

        function safeInvoke(operation) {
            try {
                return operation();
            } catch {
                return undefined;
            }
        }

        function safeRead(object, property) {
            return safeInvoke(() => object?.[property]);
        }

        function pointSnapshot(value) {
            const x = finiteNumber(safeRead(value, "x"));
            const y = finiteNumber(safeRead(value, "y"));
            return x !== null && y !== null ? { x, y } : null;
        }

        function finiteNumber(value) {
            return typeof value === "number" && Number.isFinite(value) ? value : null;
        }

        function primitiveId(value) {
            return typeof value === "string" || typeof value === "number"
                ? value
                : null;
        }

        function normalizeInspectionTag(tag) {
            if (tag === undefined) return undefined;
            if (
                typeof tag !== "string"
                || tag.length === 0
                || tag.length > MAX_INSPECTION_TAG_LENGTH
                || /\p{Cc}/u.test(tag)
            ) {
                throw new Error("Invalid KAPLAY object tag.");
            }
            return tag;
        }

        function normalizeInspectionLimit(limit) {
            if (limit === undefined) return 0;
            if (!Number.isInteger(limit) || limit < 0) {
                throw new Error("Inspection limit must be a non-negative integer.");
            }
            return Math.min(limit, MAX_INSPECTION_OBJECTS);
        }

        function boundedString(value, maxLength) {
            return value.length <= maxLength ? value : value.slice(0, maxLength);
        }

        function errorText(error) {
            const value = error instanceof Error
                ? `${error.name}: ${error.message}`
                : String(error);
            return boundedString(value, 2_000);
        }

        function postParent(message) {
            if (!PARENT_ORIGIN) return;
            window.parent.postMessage(message, PARENT_ORIGIN);
        }

        const keysToPreventDefault = ["e", "p", "s"];

        window.addEventListener("keydown", (e) => {
            if (
                (e.key.length > 1 && e.key != "Escape")
                || !(e.ctrlKey || e.metaKey || e.altKey)
            ) return;

            if (
                e.target instanceof HTMLInputElement
                || e.target instanceof HTMLTextAreaElement
                || e.target?.isContentEditable
            ) return;

            if (keysToPreventDefault.includes(e.key.toLowerCase())) {
                e.preventDefault();
            }

            postParent({
                type: "KEY_BINDING",
                e: {
                    ctrlKey: e.ctrlKey,
                    metaKey: e.metaKey,
                    shiftKey: e.shiftKey,
                    altKey: e.altKey,
                    key: e.key,
                },
            });
        });

        function consoleHook(enabled) {
            let hooked = null;

            const hook = () => {
                hooked ??= Hook(
                    window.console,
                    log =>
                        postParent({
                            type: "CONSOLE",
                            runId: activeRunId,
                            log,
                        }),
                );
            };

            const unhook = () => {
                if (!hooked) return;
                Unhook(hooked);
                hooked = null;
            };

            if (enabled) hook();

            return { hook, unhook };
        }

        function resolveConsoleFeedExport(module) {
            const exported = module?.default?.default ?? module?.default ?? module;
            if (typeof exported !== "function") {
                throw new TypeError("console-feed export is not callable");
            }
            return exported;
        }
        </script>
    </body>
</html>
