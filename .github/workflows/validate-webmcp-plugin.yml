name: Validate WebMCP and Kaplayground plugin

on:
  push:
    paths:
      - ".github/workflows/validate-webmcp-plugin.yml"
      - ".agents/plugins/marketplace.json"
      - "README.md"
      - "package.json"
      - "package-lock.json"
      - "plugins/kaplayground/**"
      - "scripts/validate-kaplay-plugin.mjs"
      - "src/integrations/webmcp/**"
      - "tests/fixtures/kaplay-plugin-contract.json"
      - "tests/flows/kaplayground-plugin.md"
      - "tests/webmcp.test.mjs"
  pull_request:
    paths:
      - ".github/workflows/validate-webmcp-plugin.yml"
      - ".agents/plugins/marketplace.json"
      - "README.md"
      - "package.json"
      - "package-lock.json"
      - "plugins/kaplayground/**"
      - "scripts/validate-kaplay-plugin.mjs"
      - "src/integrations/webmcp/**"
      - "tests/fixtures/kaplay-plugin-contract.json"
      - "tests/flows/kaplayground-plugin.md"
      - "tests/webmcp.test.mjs"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:webmcp
