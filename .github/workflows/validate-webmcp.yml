name: Validate WebMCP

on:
  push:
    paths:
      - ".github/workflows/validate-webmcp.yml"
      - "README.md"
      - "package.json"
      - "package-lock.json"
      - "src/integrations/webmcp/**"
      - "tests/fixtures/webmcp-contract.json"
      - "tests/webmcp.test.mjs"
  pull_request:
    paths:
      - ".github/workflows/validate-webmcp.yml"
      - "README.md"
      - "package.json"
      - "package-lock.json"
      - "src/integrations/webmcp/**"
      - "tests/fixtures/webmcp-contract.json"
      - "tests/webmcp.test.mjs"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:webmcp
